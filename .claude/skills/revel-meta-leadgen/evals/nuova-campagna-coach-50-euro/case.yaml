schema_version: "1.1"
name: nuova-campagna-coach-50-euro
expected_outcome: |
  Un piano di lancio coerente con il metodo Revel: conti visibili (tetto CPL e costo per call
  ricavati da 2.500 euro, primo incasso 1.250 euro e close 25 per cento), un solo ad per ad set
  con budget sopra la soglia nazionale, ottimizzazione per lead sotto i 100 al giorno, regola
  keep-or-kill al giorno 4, creatività trust-first (skillshow o sketchbook) con hook assumptivi,
  gestione del follow-up lento, calendario dei primi 12 giorni, importi in euro.
